<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Squid Game Guard System - File Manager</title>
  <style>
    body {
      background-color: #ccc;
      font-family: monospace;
      color: black;
      padding: 20px;
    }
    h1 {
      font-size: 20px;
      border-bottom: 2px solid black;
      padding-bottom: 5px;
    }
    .folder {
      margin-top: 20px;
      background: #ddd;
      padding: 10px;
      border: 1px solid #999;
    }
    .folder h2 {
      font-size: 16px;
      margin: 0 0 10px 0;
    }
    .file {
      margin-left: 20px;
    }
    button {
      font-family: monospace;
      margin: 3px;
      padding: 2px 5px;
    }
    input {
      font-family: monospace;
      padding: 2px;
    }
  </style>
</head>
<body>
  <h1>Squid Game File Manager (Old Style)</h1>
  <div id="fileSystem"></div>

  <script>
    const folders = {
      "Players": ["File.txt"],
      "Workers": ["File.txt"],
      "Soldiers": ["File.txt"],
      "Managers": ["File.txt"]
    };

    function renderFileSystem() {
      const container = document.getElementById('fileSystem');
      container.innerHTML = '';
      for (const folder in folders) {
        const div = document.createElement('div');
        div.className = 'folder';

        const h2 = document.createElement('h2');
        h2.textContent = `[Folder] ${folder}`;
        div.appendChild(h2);

        const ul = document.createElement('ul');
        folders[folder].forEach((file, index) => {
          const li = document.createElement('div');
          li.className = 'file';
          li.textContent = `📄 ${file}`;

          const renameBtn = document.createElement('button');
          renameBtn.textContent = 'Rename';
          renameBtn.onclick = () => {
            const newName = prompt('New filename:', file);
            if (newName) folders[folder][index] = newName;
            renderFileSystem();
          };

          const deleteBtn = document.createElement('button');
          deleteBtn.textContent = 'Delete';
          deleteBtn.onclick = () => {
            folders[folder].splice(index, 1);
            renderFileSystem();
          };

          li.appendChild(renameBtn);
          li.appendChild(deleteBtn);
          ul.appendChild(li);
        });

        const newFileInput = document.createElement('input');
        newFileInput.placeholder = 'NewFile.txt';

        const createBtn = document.createElement('button');
        createBtn.textContent = 'New File';
        createBtn.onclick = () => {
          if (newFileInput.value) {
            folders[folder].push(newFileInput.value);
            renderFileSystem();
          }
        };

        div.appendChild(ul);
        div.appendChild(newFileInput);
        div.appendChild(createBtn);

        container.appendChild(div);
      }
    }

    renderFileSystem();
  </script>
</body>
</html>
